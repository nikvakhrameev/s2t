[project]
name = "s2t"
version = "0.1.0"
description = "Local speech-to-text for macOS (Apple Silicon): VAD -> Whisper (MLX) -> LLM cleanup, with glossary support"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-whisper",
    "mlx-lm",
    "onnxruntime",
    "numpy",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "httpx",
    "sounddevice",
    "pynput",
]

[project.scripts]
s2t = "s2t.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s2t"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
