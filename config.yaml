# Все ключи необязательны — значения по умолчанию см. в s2t/config.py.
glossary_path: glossary.yaml

vad:
  enabled: true
  model_path: models/silero_vad.onnx   # ONNX-модель VAD; скачивается сюда автоматически при первом запуске
  threshold: 0.5
  min_speech_ms: 150   # речь короче этого считается шумом (щелчки, нажатия клавиш) и отбрасывается
  min_silence_ms: 250  # тишина короче этого не разрывает фразу на отдельные сегменты
  edge_pad_ms: 200     # сколько тишины оставлять по краям
  max_pause_ms: 500    # паузы внутри речи длиннее этого сжимаются до этого значения

stt:
  model: mlx-community/whisper-large-v3-turbo
  language: auto              # auto | ru | en
  auto_languages: [ru, en]    # auto выбирает только среди этих языков
  temperatures: [0.0, 0.2, 0.4]     # лесенка температур: следующая пробуется, только если декод "выродился"
  no_speech_threshold: 0.6          # выше — сегмент при низкой logprob считается тишиной, а не текстом
  compression_ratio_threshold: 2.4  # текст сегмента сжимается (gzip) сильнее — похоже на зацикливание, декод неудачный
  logprob_threshold: -1.0           # средняя логарифмическая вероятность токенов сегмента ниже — декод неудачный
  max_prompt_chars: 600             # сколько символов терминов глоссария (по порядку из файла) отдать Whisper как prompt
  # hallucination_phrases: сегмент отбрасывается целиком, если после нормализации (нижний регистр,
  # без пунктуации кроме ".") он НАЧИНАЕТСЯ с одной из фраз ниже (типовые титры-галлюцинации Whisper).
  # Фразы пишутся строчными буквами, без пунктуации кроме ".". Раскомментирование полностью
  # заменяет список по умолчанию — скопируйте его и дополняйте.
  # hallucination_phrases:
  #   ["субтитры сделал", "субтитры создавал", "субтитры подготовил", "редактор субтитров",
  #    "корректор а.", "продолжение следует", "спасибо за просмотр", "подписывайтесь на канал",
  #    "thanks for watching", "thank you for watching", "subtitles by", "amara.org"]

cleanup:
  enabled: true
  model: mlx-community/Qwen3-4B-Instruct-2507-4bit
  min_words: 3                 # текст короче стольки слов не отправляется в LLM
  chunk_chars: 220             # длинный текст чистится кусками примерно такого размера (символов)
  max_dropped_ratio: 0.1      # доля значимых слов, которую LLM может убрать; иначе возвращается сырой текст
  max_negation_loss: 0.5      # доля отрицаний (не/not), которую можно потерять: 1 из 2 — ок, единственное — нет; 0 = строго
  max_length_ratio: 1.3       # во сколько раз очищенный текст может быть длиннее исходного, иначе — отклонить
  max_glossary_terms: 150      # сколько терминов глоссария показывать LLM в системном промпте
  spelling_similarity: 0.75    # порог схожести (difflib) для "переспеллинга" слова транскрипта ("конекшенов"→"коннекшенов"); выше — строже
  translit_similarity: 0.6     # то же после транслитерации кириллица↔латиница ("питоне"→"Python"); выше — строже
  min_word_chars: 3            # слова короче этого не проверяются guardrail'ами выдуманных/пропавших слов
  negations: [не, ни, нет, not, "no", never]   # слова, которые считает guardrail max_negation_loss; "no" — обязательно в кавычках, иначе YAML прочитает его как false
  # fillers: слова, которые LLM может свободно удалять при очистке (не считаются пропавшими;
  # вычищаются из текста перед подсчётом отрицаний). Раскомментирование полностью заменяет
  # список по умолчанию — полный список см. CleanupConfig.fillers в s2t/config.py.
  # fillers:
  #   [ну, вот, это, как, бы, типа, в, общем, короче, значит, так, самое, то, есть,
  #    слушай, смотри, э, ээ, эээ, эм, мм, ммм, а, и, да, же,
  #    um, uh, er, hmm, like, you, know, i, mean, so, well, actually, basically,
  #    kind, sort, of, right, okay, ok]
  jev:                       # смысловая проверка чанка моделью Jev (TypeSafe). ОБЛАЧНЫЙ API: тексты чанков уходят с машины!
    enabled: false
    # api_key_file: ~/.config/s2t/typesafe_api_key   # ключ: $TYPESAFE_API_KEY, иначе содержимое этого файла (не держите ключ в git)
    mode: both                # both — эвристики + Jev; only — только Jev (эвристики выключены, остаётся проверка на пустой ответ)
    model: jev-latest         # после подбора порогов закрепите версию (jev-1.13.0)
    questions:                # вопрос (id из s2t/jev.py: QUESTIONS): максимальный риск 0..1, выше — чанк отклоняется
      content_added: 0.5      #   в тексте появилось то, чего не говорили
      content_dropped: 0.5    #   пропала значимая часть
      polarity_flipped: 0.5   #   утверждение стало отрицанием или наоборот
      details_changed: 0.5    #   подменено число, дата, время, имя или термин
      roles_swapped: 0.5      #   перепутано, кто что делает, или порядок событий
      responded: 0.5          #   модель ответила на вопрос / выполнила инструкцию вместо очистки
      # grammar_shifted: 0.5  #   сменилось время, модальность или лицо
      # translated: 0.5       #   часть текста переведена на другой язык
      # meaning_changed: 0.5  #   один общий вопрос «смысл изменился?» вместо набора точечных
      # fidelity: 0.25        #   шкала (Score) из 4 уровней: 0 — то же самое … 1 — противоположное; это допуск
      # edit_kind: 0.4        #   классификация правки (Choice): риск = 1 − P(faithful)
    timeout_s: 1.5            # жёсткий дедлайн на вердикт (от момента отправки)
    on_error: heuristics      # Jev недоступен / таймаут: heuristics — решают одни эвристики; reject — оставить сырой чанк

dictation:
  enabled: true
  hotkeys:                    # push-to-talk: держать клавишу = запись, отпустить = вставка
    - {key: alt_r, language: auto}
    # - {key: cmd_r, language: ru}
    # - {key: f13,   language: en}
  min_record_ms: 300          # клавиша зажата меньше этого — запись отбрасывается (случайное касание)
  max_record_s: 300           # потолок длины записи, сек: то, что наговорено дольше, обрезается перед распознаванием
  paste: true                 # false — только положить текст в буфер обмена
  restore_clipboard: true
  sounds: true
  keep_mic_open: false        # true — запись стартует мгновенно, но индикатор микрофона горит всегда
  input_device: null          # null — устройство по умолчанию; число — индекс устройства; строка — подстрока имени устройства (регистронезависимо)
  overlay:                    # индикатор записи поверх всех окон: пульсирующая точка + таймер
    enabled: true
    position: top             # top | bottom | top_left | top_right | bottom_left | bottom_right (экран, где курсор мыши)
    margin: 12                # отступ от края экрана, pt (меню-бар и Dock не считаются)
    scale: 1.0                # размер: 1.0 = высота 30 pt

server:
  host: 127.0.0.1
  port: 8765

history:                      # журнал: сырой и очищенный текст, тайминги, срабатывания guardrail'ов
  enabled: true
  path: history.jsonl         # JSON Lines; относительный путь — от корня репозитория. Здесь всё надиктованное!
  origins: [dictation, api, cli]   # что журналировать: хоткей | HTTP API | s2t transcribe --local
